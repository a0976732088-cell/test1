<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

</head>
<body>
	<h3>Login</h3>
	<table>
		<tr>
			<td>ID : </td>
			<td><input type="text" name="username"></td>
			<td><span id="msg"></span></td>
		</tr>
		<tr>
			<td>PWD : </td>
			<td><input type="text" name="password"></td>
			<td></td>
		</tr>
		<tr>
			<td> </td>
			<td align="right"><input type="submit" value="login" onclick="login()"></td>
		</tr>
	</table>

	<script type="text/javascript" src="https://unpkg.com/axios@1.18.1/dist/axios.min.js"></script>
	<script type="text/javascript" src="https://unpkg.com/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
	<script>
		async function login() {
			Swal.fire({
				title: "執行中......",
				allowOutsideClick: false,
				showConfirmButton: false,
			});

			const username = document.querySelector('input[name="username"]').value;
			const password = document.querySelector('input[name="password"]').value;
			const body = {
				username: username,
				password: password
			};
			try {
				const response = await axios.post("http://localhost:8080/ajax/secure/login", body);
				if(response.data.success) {
					await Swal.fire({
						title: response.data.message,
						icon: "success"
					});
					window.location.href = "http://localhost:8080/ajax.html";
				} else {
					document.querySelector('#msg').innerHTML = response.data.message;
					Swal.fire({
						title: response.data.message,
						icon: "warning"
					});
				}
			} catch (error) {
				console.log("error", error);
				Swal.fire({
					title: "登入失敗",
					text: error,
					icon: "error"
				});
			}
		}
	</script>

</body>
</html>
